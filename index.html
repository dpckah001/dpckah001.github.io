---
layout: default
---
<div class="container">
  <header class="site-head">
    <div class="kicker">~/index</div>
    <h1>{{ site.title }}</h1>
    <p class="lede">{{ site.description | default: "A technical blog." }}</p>
  </header>

  <div class="search">
    <div class="bar">
      <span class="prompt">$</span>
      <input type="text" id="search-input" placeholder="grep posts..." autocomplete="off">
    </div>
    <div id="search-results"></div>
  </div>

  <div class="feed-head">
    <span>MANIFEST</span>
  </div>

  <div class="feed">
    {% for post in site.posts %}
    <article class="post" data-id="{{ forloop.index | prepend: '00' | slice: -3, 3 }}">
      <div class="stamp">
        <span class="code">[{{ post.date | date: "%Y-%m-%d" }}]</span>
      </div>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <div class="tags">
        {% for tag in post.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      <div class="arrow">→</div>
    </article>
    {% endfor %}
  </div>
</div>
