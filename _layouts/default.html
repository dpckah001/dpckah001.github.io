<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} // {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip | truncate: 150 }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:{{ site.dpck.accent_color }};
      --cold:{{ site.dpck.cold_white }};
      --ok:{{ site.dpck.status_ok }};
    }
  </style>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <div class="bg-fx"></div>
  {% include hud.html %}

  <div class="shell">
    <div class="container">
      {{ content }}

      <footer class="site-foot">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
        <span>// DPCK_THEME · 2019-shell / dedsec-core</span>
        <span style="margin-left:auto">session closed<span class="cur"></span></span>
      </footer>
    </div>
  </div>

  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
