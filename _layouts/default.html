<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/dedsec.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
</head>
<body class="{% if site.dedsec.show_scanlines %}scanlines{% endif %}">
  
  <!-- CRT Overlay -->
  <div class="crt-overlay"></div>
  
  <!-- Navigation -->
  <nav class="dedsec-nav">
	<div class="ascii-logo">
{% for line in site.dedsec.ascii_logo %}{{ line }}
{% endfor %}
	</div>
    <ul>
      <li><a href="{{ '/' | relative_url }}" data-text="[ HOME ]">[ HOME ]</a></li>
      <li><a href="{{ '/about' | relative_url }}" data-text="[ MANIFESTO ]">[ MANIFESTO ]</a></li>
      <li><a href="{{ '/ops' | relative_url }}" data-text="[ OPERATIONS ]">[ OPERATIONS ]</a></li>
      <li><a href="{{ '/blog' | relative_url }}" data-text="[ DATA_LOGS ]">[ DATA_LOGS ]</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="dedsec-container">
    <h1 class="glitch" data-text="{{ page.title }}">{{ page.title }}</h1>
    <div class="content-block">
      {{ content }}
    </div>
  </main>

  <!-- Footer -->
  <footer class="dedsec-footer">
    <p>> SYSTEM_STATUS: <span class="status-online">ONLINE</span></p>
    <p>> JOIN_US: #DEDSEC // WE_ARE_LEGION</p>
    <p class="copyright">&copy; {{ 'now' | date: "%Y" }} DEDSEC COLLECTIVE. NO RIGHTS RESERVED.</p>
  </footer>

  <script src="{{ '/assets/js/glitch.js' | relative_url }}"></script>
</body>
</html>
