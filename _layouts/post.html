---
layout: default
---
<div class="read-bar" id="read-bar"></div>

<article class="article">
  <a class="back" href="{{ '/' | relative_url }}">&lt; cd ..</a>
  <div class="meta-row">
    <span>{{ page.date | date: "%Y-%m-%d" }}</span>
    <span class="ok">[ok]</span>
    {% if page.tags %}<span>{% for t in page.tags %}#{{ t }} {% endfor %}</span>{% endif %}
  </div>

  <h1>{{ page.title }}</h1>

  <nav class="article-toc" id="article-toc" aria-label="文章目录">
    <div class="article-toc-title">目录</div>
    <ol></ol>
  </nav>

  <div class="article-content">
    {{ content }}
  </div>

  {% include giscus.html %}
</article>
