---
layout: default
---
<div class="read-bar" id="read-bar"></div>

<article class="article">
  <a class="back" href="{{ '/' | relative_url }}">&lt; cd ..</a>
  <div class="meta-row">
    <span>{{ page.date | date: "%Y-%m-%d" }}</span>
    <span class="ok">[decrypted]</span>
    {% if page.tags %}<span>{% for t in page.tags %}#{{ t }} {% endfor %}</span>{% endif %}
  </div>

  <h1><span class="glitch" data-text="{{ page.title }}">{{ page.title }}</span></h1>

  {{ content }}
</article>
